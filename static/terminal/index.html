<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kenny Nguyen - Terminal</title>
		<meta name="description" content="Interactive terminal portfolio for Kenny Nguyen" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<style>
			@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

			*,
			*::before,
			*::after {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			:root {
				--base: #282c34;
				--surface0: #2c313a;
				--surface1: #3e4451;
				--text: #abb2bf;
				--subtext0: #828997;
				--accent: #61afef;
				--green: #98c379;
				--red: #e06c75;
				--yellow: #e5c07b;
			}

			html,
			body {
				height: 100%;
				background: var(--base);
				color: var(--text);
				font-family: 'JetBrains Mono', monospace;
				font-size: 14px;
				overflow: hidden;
			}

			#terminal {
				display: flex;
				flex-direction: column;
				height: 100vh;
				border: 1px solid var(--accent);
				margin: 8px;
				border-radius: 8px;
				overflow: hidden;
				height: calc(100vh - 16px);
			}

			#output {
				flex: 1;
				overflow-y: auto;
				padding: 24px 32px;
				scrollbar-width: thin;
				scrollbar-color: var(--surface1) transparent;
			}

			#output::-webkit-scrollbar {
				width: 6px;
			}
			#output::-webkit-scrollbar-track {
				background: transparent;
			}
			#output::-webkit-scrollbar-thumb {
				background: var(--surface1);
				border-radius: 3px;
			}

			.line {
				white-space: pre-wrap;
				word-break: break-word;
				line-height: 1.6;
			}
			.prompt {
				color: var(--green);
			}
			.cmd-text {
				color: var(--text);
			}
			.error {
				color: var(--red);
			}
			.system {
				color: var(--yellow);
			}
			.accent {
				color: var(--accent);
			}
			.subtext {
				color: var(--subtext0);
			}
			.green {
				color: var(--green);
			}

			#input-line {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0;
				line-height: 1.6;
			}

			#input-line .prompt {
				white-space: nowrap;
				user-select: none;
			}

			#cmd-input {
				flex: 1;
				background: transparent;
				border: none;
				outline: none;
				color: var(--text);
				font-family: inherit;
				font-size: inherit;
				caret-color: var(--accent);
				padding: 0;
				min-width: 0;
			}

			#cmd-input:focus {
				outline: none;
				box-shadow: none;
			}

			pre.banner {
				white-space: pre;
				line-height: 1.1;
				font-size: 16px;
				margin-bottom: 16px;
			}

			@media (max-width: 640px) {
				#output {
					padding: 16px;
				}
				pre.banner {
					font-size: 8px;
				}
			}
		</style>
	</head>
	<body>
		<div id="terminal">
			<div id="output">
				<div id="history"></div>
				<div id="input-line">
					<span class="prompt">visitor@kennynguyen.me:~$</span>
					<input
						id="cmd-input"
						type="text"
						spellcheck="false"
						autocomplete="off"
						autocapitalize="off"
						autofocus
					/>
				</div>
			</div>
		</div>

		<script>
			const PROMPT = 'visitor@kennynguyen.me:~$';

			const BANNER = `<pre class="banner"><span class="accent">██╗  ██╗███████╗███╗   ██╗███╗   ██╗██╗   ██╗  ███╗   ██╗ ██████╗ ██╗   ██╗██╗   ██╗███████╗███╗   ██╗
██║ ██╔╝██╔════╝████╗  ██║████╗  ██║╚██╗ ██╔╝  ████╗  ██║██╔════╝ ██║   ██║╚██╗ ██╔╝██╔════╝████╗  ██║
█████╔╝ █████╗  ██╔██╗ ██║██╔██╗ ██║ ╚████╔╝   ██╔██╗ ██║██║  ███╗██║   ██║ ╚████╔╝ █████╗  ██╔██╗ ██║
██╔═██╗ ██╔══╝  ██║╚██╗██║██║╚██╗██║  ╚██╔╝    ██║╚██╗██║██║   ██║██║   ██║  ╚██╔╝  ██╔══╝  ██║╚██╗██║
██║  ██╗███████╗██║ ╚████║██║ ╚████║   ██║     ██║ ╚████║╚██████╔╝╚██████╔╝   ██║   ███████╗██║ ╚████║
╚═╝  ╚═╝╚══════╝╚═╝  ╚═══╝╚═╝  ╚═══╝   ╚═╝     ╚═╝  ╚═══╝ ╚═════╝  ╚═════╝    ╚═╝   ╚══════╝╚═╝  ╚═══╝</span></pre>
Welcome to my interactive terminal portfolio.
Type '<span class="green">help</span>' for instructions on how to use this terminal.

Type <span class="green">sumfetch</span> to display summary.
Type '<span class="green">home</span>' to go to the main portfolio.`;

			const COMMANDS = {
				help: {
					desc: 'List available commands',
					run: () => {
						const cmds = Object.entries(COMMANDS)
							.map(([name, c]) => `  <span class="accent">${name.padEnd(14)}</span> ${c.desc}`)
							.join('\n');
						return cmds;
					}
				},
				about: {
					desc: 'About me',
					run: () => `Hey! I'm Kenny Nguyen.
CS student at Arizona State University in the accelerated 4+1 program (B.S. + M.S.).
Most interested in backend engineering, lately working in Go.
Always looking for new opportunities to learn and build.`
				},
				education: {
					desc: 'Education info',
					run: () => `<span class="accent">M.S. in Computer Science</span>
  Arizona State University
  Expected May 2027 — Accelerated 4+1 Program

<span class="accent">B.S. in Computer Science</span>
  Arizona State University
  Expected May 2026 — GPA: 3.88

<span class="accent">Relevant Coursework:</span>
  Foundations of Algorithms, Mobile Computing, Foundations of Machine Learning,
  Software QA & Testing, Computer Networks, Software Engineering,
  Programming Languages, Operating Systems, Data Structures & Algorithms`
				},
				experience: {
					desc: 'Work experience',
					run: () => `<span class="accent">Software Engineer Intern</span> @ Opportunity Hack
  Summer 2025 | Remote
  · Led a 3-person team to design and ship a full-stack alumni platform serving 1,000+ users
  · Designed data model and access control with Row Level Security and Clerk auth
  · Delivered interactive alumni world map with 400+ members, CSV bulk import, admin dashboard
  · Integrated Mapbox geocoding, Supabase PostgreSQL, Mailgun email campaigns`
				},
				skills: {
					desc: 'Technical skills',
					run: () => `<span class="accent">Languages:</span>    Go, Python, Java, C/C++, JavaScript, TypeScript, HTML, CSS, SQL
<span class="accent">Frameworks:</span>   React, Next.js, Node.js, Tailwind CSS, Git, Linux`
				},
				projects: {
					desc: 'Project showcase',
					run: () => `<span class="accent">Redis Clone</span> <span class="subtext">(https://github.com/Intro0/redis-from-scratch-go)</span>
  Redis server from scratch in Go — 9 commands, TTL, Streams, RESP protocol on raw TCP

<span class="accent">Shell Clone</span> <span class="subtext">(https://github.com/Intro0/shell-from-scratch-go)</span>
  POSIX-like shell in Go — REPL, builtins, PATH resolution, process management

<span class="accent">Distributed Storage System</span>
  Fault-tolerant distributed storage with XOR parity, parallel striped I/O, multi-process recovery

<span class="accent">Compiler</span>
  C++ compiler with recursive descent parser, IR code generation, symbol table, PC-based execution`
				},
				contact: {
					desc: 'Contact information',
					run: () => `<span class="accent">Email:</span>     kennytrung0603@icloud.com
<span class="accent">GitHub:</span>    https://github.com/Intro0
<span class="accent">LinkedIn:</span>  https://www.linkedin.com/in/kenny-nguyenn/`
				},
				email: {
					desc: 'Contact information',
					run: () => COMMANDS.contact.run()
				},
				resume: {
					desc: 'Open resume PDF',
					run: () => {
						window.open('/resume.pdf', '_blank');
						return '<span class="system">Opening resume...</span>';
					}
				},
				github: {
					desc: 'Open GitHub profile',
					run: () => {
						window.open('https://github.com/Intro0', '_blank');
						return '<span class="system">Opening GitHub...</span>';
					}
				},
				linkedin: {
					desc: 'Open LinkedIn profile',
					run: () => {
						window.open('https://www.linkedin.com/in/kenny-nguyenn/', '_blank');
						return '<span class="system">Opening LinkedIn...</span>';
					}
				},
				sumfetch: {
					desc: 'Display summary',
					run: () => `<span class="accent">kennynguyen.me</span>
<span class="accent">---------------</span>
<span class="accent">About:</span>    CS student @ ASU (4+1 B.S. + M.S.)
<span class="accent">Focus:</span>    Backend Engineering, Go
<span class="accent">GPA:</span>      3.88

<span class="accent">Contact</span>
<span class="accent">-------</span>
<span class="accent">Email:</span>    kennytrung0603@icloud.com
<span class="accent">GitHub:</span>   github.com/Intro0
<span class="accent">LinkedIn:</span> linkedin.com/in/kenny-nguyenn
<span class="accent">Website:</span>  kennynguyen.me`
				},
				home: {
					desc: 'Go to portfolio homepage',
					run: () => {
						window.location.href = '/';
						return '<span class="system">Navigating to portfolio...</span>';
					}
				},
				clear: {
					desc: 'Clear terminal',
					run: () => null
				},
				banner: {
					desc: 'Show welcome banner',
					run: () => BANNER
				},
				history: {
					desc: 'Show command history',
					run: () => cmdHistory.map((c, i) => `  ${String(i + 1).padStart(4)}  ${c}`).join('\n')
				}
			};

			const historyEl = document.getElementById('history');
			const inputEl = document.getElementById('cmd-input');
			const outputEl = document.getElementById('output');
			const cmdHistory = [];
			let historyIndex = -1;

			function addOutput(html) {
				const div = document.createElement('div');
				div.className = 'line';
				div.innerHTML = html;
				historyEl.appendChild(div);
			}

			function addCommand(text) {
				addOutput(
					`<span class="prompt">${PROMPT}</span> <span class="cmd-text">${escapeHtml(text)}</span>`
				);
			}

			function escapeHtml(str) {
				return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			}

			function scrollToBottom() {
				outputEl.scrollTop = outputEl.scrollHeight;
			}

			function execute(raw) {
				const trimmed = raw.trim();

				if (trimmed === '') {
					addCommand('');
					scrollToBottom();
					return;
				}

				cmdHistory.push(trimmed);
				historyIndex = -1;
				addCommand(trimmed);

				const [cmd, ...args] = trimmed.toLowerCase().split(/\s+/);

				if (cmd === 'clear') {
					historyEl.innerHTML = '';
					scrollToBottom();
					return;
				}

				const command = COMMANDS[cmd];
				if (!command) {
					addOutput(
						`<span class="error">Command not found: ${escapeHtml(cmd)}. Type 'help' for available commands.</span>`
					);
					scrollToBottom();
					return;
				}

				const result = command.run(args);
				if (result !== null && result !== undefined) {
					addOutput(result);
				}
				scrollToBottom();
			}

			// Tab completion
			function tabComplete(partial) {
				if (!partial) return null;
				const lower = partial.toLowerCase();
				const names = Object.keys(COMMANDS).sort();
				const matches = names.filter((n) => n.startsWith(lower));
				if (matches.length === 1) return matches[0];
				if (matches.length > 1) {
					let prefix = matches[0];
					for (const m of matches.slice(1)) {
						while (!m.startsWith(prefix)) prefix = prefix.slice(0, -1);
					}
					if (prefix.length > partial.length) return prefix;
					addOutput(`<span class="system">${matches.join('  ')}</span>`);
					scrollToBottom();
				}
				return null;
			}

			inputEl.addEventListener('keydown', (e) => {
				if (e.key === 'Enter') {
					e.preventDefault();
					execute(inputEl.value);
					inputEl.value = '';
				} else if (e.key === 'Tab') {
					e.preventDefault();
					const completed = tabComplete(inputEl.value);
					if (completed) inputEl.value = completed;
				} else if (e.key === 'ArrowUp') {
					e.preventDefault();
					if (cmdHistory.length === 0) return;
					if (historyIndex === -1) historyIndex = cmdHistory.length;
					if (historyIndex > 0) {
						historyIndex--;
						inputEl.value = cmdHistory[historyIndex];
					}
				} else if (e.key === 'ArrowDown') {
					e.preventDefault();
					if (historyIndex === -1) return;
					if (historyIndex < cmdHistory.length - 1) {
						historyIndex++;
						inputEl.value = cmdHistory[historyIndex];
					} else {
						historyIndex = -1;
						inputEl.value = '';
					}
				} else if (e.key === 'l' && e.ctrlKey) {
					e.preventDefault();
					historyEl.innerHTML = '';
					inputEl.value = '';
					scrollToBottom();
				}
			});

			// Click anywhere to focus input
			document.getElementById('terminal').addEventListener('click', () => {
				inputEl.focus();
			});

			// Show banner on load
			addOutput(BANNER);
			inputEl.focus();
		</script>
	</body>
</html>
